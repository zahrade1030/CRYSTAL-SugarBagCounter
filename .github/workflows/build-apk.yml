name: Build CRYSTAL.BIN APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master, improved-tracking ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CRYSTAL_KEYSTORE_BASE64: ${{ secrets.CRYSTAL_KEYSTORE_BASE64 }}
      CRYSTAL_KEYSTORE_PASSWORD: ${{ secrets.CRYSTAL_KEYSTORE_PASSWORD }}
      CRYSTAL_KEY_ALIAS: ${{ secrets.CRYSTAL_KEY_ALIAS }}
      CRYSTAL_KEY_PASSWORD: ${{ secrets.CRYSTAL_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare optional release signing key
        if: ${{ env.CRYSTAL_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$CRYSTAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/crystal-release.jks"
          echo "CRYSTAL_KEYSTORE_PATH=$RUNNER_TEMP/crystal-release.jks" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        run: gradle clean assembleDebug assembleRelease --no-build-cache --rerun-tasks

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CRYSTAL-BIN-APKs-v1.1.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
